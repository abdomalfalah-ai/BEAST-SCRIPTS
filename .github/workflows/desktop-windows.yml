name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", "public/**", "reel-maker/builder/**", ".github/workflows/desktop-windows.yml"]
  pull_request:
    paths: ["desktop/**", "public/**", "reel-maker/builder/**", ".github/workflows/desktop-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # Tscaps auto-captions editor, pinned in scripts/build-captions.mjs.
      # Its install hooks call `pnpm` by name, so corepack's shim must be on PATH.
      - run: corepack enable
      - run: node scripts/build-captions.mjs

      - run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Beast-Scripts-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
