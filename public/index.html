<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Beast Scripts" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Beast Coaching AI Script Writer" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <title>Beast Scripts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overscroll-behavior: none;
    }
    html { height: -webkit-fill-available; }
    textarea::placeholder { color: #555; }
    button { font-family: 'Inter', sans-serif; cursor: pointer; -webkit-appearance: none; }
    button:active { transform: scale(0.97) !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .view-enter { animation: fadeIn 0.35s ease-out; }
    .card-hover:active { transform: scale(0.97); }

    .header { padding-top: max(20px, env(safe-area-inset-top)); }
    .bottom-bar { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .content { padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom))); }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #222; color: #fff; padding: 10px 24px; border-radius: 20px;
      font-size: 14px; z-index: 999; animation: fadeIn 0.3s ease;
      border: 1px solid #333;
    }

    .streaming-cursor::after {
      content: '|'; animation: pulse 0.8s infinite; color: #FF4500; font-weight: 900;
    }

    .script-editable {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 16px;
      padding: 20px; margin-bottom: 16px; line-height: 2; font-size: 16px;
      direction: rtl; min-height: 120px; outline: none; color: #f0f0f0;
      font-family: 'Inter', 'Tajawal', sans-serif; width: 100%; resize: vertical;
      transition: border-color 0.2s;
    }
    .script-editable:focus { border-color: #FF4500; }

    .star-btn { transition: transform 0.2s; }
    .star-btn:active { transform: scale(1.3) !important; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ─── CONFIG ───
const BRAND = {
  name: "Beast Coaching",
  coach: "Coach Abdelrahman",
  handle: "@beastcoachingegypt",
  tagline: "No Place For Weakness",
  systemPrompt: `You are an Arabic motivational script writer for "Beast Coaching by Coach Abdelrahman" (@beastcoachingegypt).

Your writing style:
- David Goggins energy: raw, intense, no-excuses, confrontational self-talk
- Speak directly to the viewer like a tough coach who genuinely cares
- Use Egyptian Arabic dialect mixed with Modern Standard Arabic for impact
- Short punchy sentences. Repetition for emphasis. Rhetorical questions that hit hard.
- Build emotional tension — start with pain/struggle, escalate, then deliver the breakthrough moment
- Reference real struggle: waking up early, pushing through pain, ignoring haters, choosing discipline over comfort
- End with a powerful call to action or a line that sticks in the viewer's head
- Use fitness/training metaphors naturally (the gym is life's classroom)
- Brand sign-off when appropriate: "Beast Coaching - لا مكان للضعف هنا"

Short-video rules (the first 3 seconds decide everything):
- The first 3 words must bite. Never open with a greeting, an introduction or "hi guys".
- Every section must earn the next one: build tension, never let the energy drop.
- Deliver exactly what the hook promised.
- End with a natural micro call-to-action (save it, send it to someone who needs it, answer in the comments). Shares matter most.

IMPORTANT: Write ONLY in Arabic. The entire script must be in Arabic (Egyptian dialect preferred with MSA for powerful moments).
Respond ONLY with the script content. No English. No explanations. No markdown formatting (no **, no #).
Put each section on its own line starting with its time range exactly as given, e.g. [0:00-0:03], then the spoken lines under it with clear line breaks for video pacing.`
};

// Hook formulas, adapted from github.com/azizaeffendi/video-script-content-system (MIT)
const HOOKS = [
  { id:"auto", label:"🎯 Auto", desc:"The AI picks the strongest hook for this topic", instruction:"اختار أقوى نوع هوك يناسب الموضوع." },
  { id:"challenge", label:"👊 Direct Challenge", desc:"Call out the viewer: \"If you're still making excuses, don't scroll\"", instruction:"ابدأ بتحدي مباشر للمشاهد، زي: \"لو إنت لسه بتأجل، ما تعملش سكرول\"." },
  { id:"truth", label:"⚡ Hard Truth", desc:"A shocking fact that breaks a common belief", instruction:"ابدأ بحقيقة صادمة بتكسر اعتقاد شائع عند المشاهد." },
  { id:"controversial", label:"🧨 Controversial", desc:"\"Everyone tells you X… that's a lie\"", instruction:"ابدأ برأي عكس السائد: \"كل الناس بتقولك [كذا]… وده كدب.\"" },
  { id:"result", label:"🏆 Result First", desc:"Open on the victory, then show the journey", instruction:"ابدأ بالنتيجة النهائية أو لحظة الانتصار، وبعدين ارجع للرحلة اللي وصلت لها." },
  { id:"relatable", label:"🫵 Relatable Pain", desc:"A struggle the viewer lived this week", instruction:"ابدأ بموقف أو ألم المشاهد عاشه قبل كده، زي: \"لو صحيت النهارده وإنت مش طايق نفسك...\"" },
  { id:"curiosity", label:"🔒 Curiosity Gap", desc:"Set up a question and hold the answer until the end", instruction:"افتح فجوة فضول: ابدأ بموقف أو سؤال من غير ما تكشف الإجابة، والمشاهد لازم يكمل للآخر عشان يعرفها." },
  { id:"stakes", label:"⏳ The Stakes", desc:"The price the viewer pays if nothing changes", instruction:"ابدأ بالثمن اللي المشاهد هيدفعه لو فضل زي ما هو." },
  { id:"interrupt", label:"✋ Pattern Interrupt", desc:"A short, unexpected line: \"Stop. Listen.\"", instruction:"ابدأ بجملة قصيرة جداً وغير متوقعة تكسر السكرول، زي: \"استنى. اسمعني.\"" },
];

// Video structures, adapted from the same repo's Reels/TikTok formats
const FORMATS = [
  { id:"rant", label:"🎙️ Coach Rant", desc:"Straight-to-camera monologue that keeps escalating", instruction:"مونولوج كوتش مباشر للكاميرا: جمل قصيرة، تصعيد مستمر، وكلام موجه للمشاهد بصيغة \"إنت\"." },
  { id:"story", label:"📖 Story Arc", desc:"Lowest point → struggle → transformation → lesson", instruction:"قصة شخصية: ابدأ من أوطى نقطة، بعدين الرحلة والصراع، وبعدين التحول والدرس." },
  { id:"myth", label:"💥 Myth Busting", desc:"The lie people believe, then the truth", instruction:"كسر خرافة: اذكر الخرافة اللي الناس مصدقاها، وبعدين الحقيقة بدليل من التمرين والحياة." },
  { id:"rapid", label:"⚡ Rapid Fire", desc:"Quick-hit rules, one per line, strongest last", instruction:"نقاط سريعة: قواعد أو حقائق ورا بعض، كل واحدة في جملة أو اتنين، والأقوى في الآخر." },
  { id:"before-after", label:"🔁 Before vs After", desc:"The weak version vs the beast version of the same person", instruction:"زمان ودلوقتي: قارن بين النسخة الضعيفة والنسخة الوحش من نفس الشخص." },
  { id:"days", label:"📅 Day-X Challenge", desc:"\"I did X for 30 days\": day 1, the middle, the result", instruction:"تحدي أيام: \"عملت [كذا] لمدة [عدد] يوم\"، اليوم الأول، النص، الآخر، وبعدين النتيجة والدرس." },
];

const TEMPLATES = [
  { id:"wake-up", icon:"⚡", title:"Wake Up Call", subtitle:"Early Rise & Discipline", prompt:"اكتب سكريبت فيديو تحفيزي قوي عن الصحيان بدري والانضباط الصباحي. أسلوب ديفيد جوجينز.", color:"#FF4500" },
  { id:"no-excuses", icon:"🔥", title:"No Excuses", subtitle:"Stop Making Excuses", prompt:"اكتب سكريبت تحفيزي عن التوقف عن الأعذار والبدء في العمل. خاطب الشخص اللي بيأجل حياته. أسلوب قوي وصادم.", color:"#DC143C" },
  { id:"pain", icon:"💀", title:"Embrace The Pain", subtitle:"Pain Is The Way", prompt:"اكتب سكريبت عن احتضان الألم والتعب كوقود للنجاح. اربط بين ألم التمرين وألم الحياة. أسلوب ديفيد جوجينز الخام.", color:"#8B0000" },
  { id:"haters", icon:"🐺", title:"Let Them Talk", subtitle:"Silence The Doubters", prompt:"اكتب سكريبت تحفيزي عن تجاهل الكارهين والمنتقدين. كيف تحول كلامهم لوقود. أسلوب واثق وقوي.", color:"#4A0E4E" },
  { id:"discipline", icon:"⛓️", title:"Discipline Over All", subtitle:"Discipline > Motivation", prompt:"اكتب سكريبت عن أن الانضباط أهم من التحفيز. التحفيز بيروح لكن الانضباط بيبني. أسلوب حاد ومباشر.", color:"#1a1a2e" },
  { id:"transformation", icon:"🦁", title:"Transformation", subtitle:"From Weak To Beast", prompt:"اكتب سكريبت عن رحلة التحول من شخص عادي لوحش. من الضعف للقوة. اجعلها شخصية ومؤثرة. أسلوب سردي قوي.", color:"#B8860B" },
  { id:"gym", icon:"🏋️", title:"The Iron Temple", subtitle:"Gym Is Life's Classroom", prompt:"اكتب سكريبت عن الجيم كمدرسة للحياة. كل تمرين درس. كل ألم نمو. اربط التمرين بالنجاح في الحياة.", color:"#2F4F4F" },
  { id:"custom", icon:"✍️", title:"Custom Script", subtitle:"Write Your Own Idea", prompt:"", color:"#333333" }
];

const DURATIONS = [
  { label:"30 Seconds", value:"30 ثانية", seconds:30 },
  { label:"1 Minute", value:"دقيقة واحدة", seconds:60 },
  { label:"1.5 Minutes", value:"دقيقة ونصف", seconds:90 },
  { label:"2 Minutes", value:"دقيقتين", seconds:120 },
];

const INTENSITIES = [
  { label:"🔥", value:"تحفيزي قوي", desc:"Strong" },
  { label:"💀", value:"صادم وخام مثل ديفيد جوجينز", desc:"Raw Goggins" },
  { label:"🫀", value:"عاطفي ومؤثر مع رسالة قوية", desc:"Emotional" },
];

// Set by desktop/preload.js when running inside the Windows app
const IS_DESKTOP = !!window.beastDesktop;

// ─── STATE ───
let state = {
  view: "home",
  selectedTemplate: null,
  customPrompt: "",
  duration: DURATIONS[1],
  intensity: INTENSITIES[1],
  hook: HOOKS[0],
  format: FORMATS[0],
  withNotes: false,
  withCaption: false,
  loading: false,
  streaming: false,
  generatedScript: "",
  history: [],
  favorites: [],
  error: "",
  toast: null,
  historyFilter: "all",
  settings: null,
  settingsDraft: { groqKey: "", ollamaModel: "" },
};

// ─── STORAGE ───
function loadHistory() {
  try {
    const data = localStorage.getItem("beast-history");
    if (data) state.history = JSON.parse(data);
    const favs = localStorage.getItem("beast-favorites");
    if (favs) state.favorites = JSON.parse(favs);
  } catch(e) {}
}
function saveHistory() {
  try {
    localStorage.setItem("beast-history", JSON.stringify(state.history));
    localStorage.setItem("beast-favorites", JSON.stringify(state.favorites));
  } catch(e) {}
}

// ─── RENDER ENGINE ───
function $(sel) { return document.querySelector(sel); }
function render() { $("#app").innerHTML = renderApp(); bindEvents(); }

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2000);
}

// ─── HELPERS ───
function countWords(text) {
  return text.trim().split(/\s+/).filter(w => w.length > 0).length;
}

function estimateReadTime(text) {
  const words = countWords(text);
  const seconds = Math.ceil(words / 2.5);
  if (seconds < 60) return `${seconds}s`;
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
}

function isFavorite(id) {
  return state.favorites.includes(id);
}

function toggleFavorite(id) {
  if (isFavorite(id)) {
    state.favorites = state.favorites.filter(f => f !== id);
  } else {
    state.favorites.push(id);
  }
  saveHistory();
  render();
}

function formatTime(sec) {
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

// Hook → setup → payoff → micro-CTA, scaled to the chosen length
function buildPrompt(topic) {
  const total = state.duration.seconds;
  const setupEnd = Math.max(8, Math.round(total * 0.2));
  const valueEnd = Math.round(total * 0.8);
  const range = (a, b) => `[${formatTime(a)}-${formatTime(b)}]`;

  const parts = [
    topic,
    "",
    `مدة الفيديو المطلوبة: ${state.duration.value} (حوالي ${Math.round(total * 2.5)} كلمة)`,
    `الأسلوب: ${state.intensity.value}`,
    `الهوك: ${state.hook.instruction}`,
    `شكل الفيديو: ${state.format.instruction}`,
    "",
    "قسّم السكريبت بالتوقيتات دي بالظبط:",
    `${range(0, 3)} الهوك: أقوى جملة في الفيديو كله، توقف السكرول.`,
    `${range(3, setupEnd)} التمهيد: ابني التوتر أو المشكلة.`,
    `${range(setupEnd, valueEnd)} القلب: نفّذ اللي الهوك وعد بيه، حسب شكل الفيديو.`,
    `${range(valueEnd, total)} الختام: جملة تفضل في دماغ المشاهد + دعوة بسيطة (احفظ الفيديو / ابعته لحد محتاجه / اكتب في الكومنتات).`,
  ];

  if (state.withNotes) {
    parts.push("", "تحت كل قسم ضيف سطرين: \"🎥 المشهد:\" (إيه اللي يظهر في الكادر) و \"📝 على الشاشة:\" (نص قصير أقصى 7 كلمات).");
  }
  if (state.withCaption) {
    parts.push("", "بعد السكريبت اكتب سطر \"———\" وبعده \"الكابشن:\" (جملة هوك + جملتين قيمة + سؤال للكومنتات) وبعدها 5 هاشتاجات.");
  }
  parts.push("", "اكتب السكريبت الآن بالعربي فقط.");
  return parts.join("\n");
}

function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate(10);
}

// ─── STREAMING API ───
async function generateScript() {
  state.loading = true;
  state.streaming = true;
  state.error = "";
  state.generatedScript = "";
  state.view = "result";
  render();
  haptic();

  const t = state.selectedTemplate;
  const prompt = t.id === "custom" ? state.customPrompt : t.prompt;
  const fullPrompt = buildPrompt(prompt);

  try {
    const resp = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: BRAND.systemPrompt,
        messages: [{ role: "user", content: fullPrompt }],
      }),
    });

    if (!resp.ok) {
      let errMsg = `Server error (${resp.status})`;
      try {
        const errData = await resp.json();
        errMsg = errData.error || errMsg;
      } catch(e) {}

      // The desktop app already sends a specific message; these hints are for the Render site
      if (!IS_DESKTOP) {
        if (resp.status === 401) errMsg = "Invalid API key. Please update GROQ_API_KEY in Render environment settings.";
        else if (resp.status === 429) errMsg = "Rate limit reached. Please wait a moment and try again.";
        else if (resp.status === 500) errMsg = "Server error. Please check that GROQ_API_KEY is set in Render.";
      }

      throw new Error(errMsg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          try {
            const parsed = JSON.parse(data);
            if (parsed.type === "content_block_delta" && parsed.delta?.text) {
              state.generatedScript += parsed.delta.text;
              updateStreamingView();
            }
          } catch (e) {}
        }
      }
    }

    // Save to history
    if (state.generatedScript.trim()) {
      const entry = {
        id: Date.now(),
        template: t.title,
        icon: t.icon,
        duration: state.duration.label,
        intensity: state.intensity.desc,
        hook: state.hook.label,
        format: state.format.label,
        script: state.generatedScript,
        timestamp: new Date().toISOString(),
      };
      state.history = [entry, ...state.history].slice(0, 50);
      saveHistory();
    }

  } catch(e) {
    state.error = e.message || "Something went wrong. Please try again.";
    console.error(e);
  }

  state.loading = false;
  state.streaming = false;
  render();
}

function updateStreamingView() {
  const el = document.getElementById("script-output");
  if (el) {
    el.innerHTML = state.generatedScript.replace(/\n/g, "<br>");
    el.scrollTop = el.scrollHeight;
  }
  const statsEl = document.getElementById("script-stats");
  if (statsEl) {
    const words = countWords(state.generatedScript);
    const readTime = estimateReadTime(state.generatedScript);
    statsEl.innerHTML = `${words} words &bull; ${readTime} read time`;
  }
}

// ─── SHARE ───
function shareWhatsApp() {
  const text = `${state.generatedScript}\n\n— Beast Coaching ${BRAND.handle}`;
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
  haptic();
}

function copyScript() {
  const editArea = document.getElementById("script-edit");
  const text = editArea ? editArea.value : state.generatedScript;
  navigator.clipboard.writeText(text).then(() => {
    showToast("Copied!");
    haptic();
  });
}

// ─── VIEWS ───
function renderApp() {
  let content = "";
  if (state.view === "home") content = renderHome();
  else if (state.view === "generate") content = renderGenerate();
  else if (state.view === "result") content = renderResult();
  else if (state.view === "history") content = renderHistory();
  else if (state.view === "settings") content = renderSettings();

  return `
    ${renderHeader()}
    <div class="view-enter">${content}</div>
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
    <div class="bottom-bar" style="position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,#0a0a0a);padding:40px 0 12px;text-align:center;pointer-events:none;z-index:10;">
      <div style="font-size:10px;color:#333;letter-spacing:2px;text-transform:uppercase;">Beast Coaching &copy; ${BRAND.handle}</div>
    </div>
  `;
}

function renderHeader() {
  const historyBtn = `<button onclick="nav('${state.view==="history"?"home":"history"}')" style="background:${state.view==="history"?"#FF4500":"#1e1e1e"};border:1px solid ${state.view==="history"?"#FF4500":"#2a2a2a"};color:${state.view==="history"?"#fff":"#f0f0f0"};border-radius:10px;padding:8px 14px;font-size:13px;">History</button>`;
  const settingsBtn = IS_DESKTOP ? `<button onclick="nav('${state.view==="settings"?"home":"settings"}')" title="Settings" style="background:${state.view==="settings"?"#FF4500":"#1e1e1e"};border:1px solid ${state.view==="settings"?"#FF4500":"#2a2a2a"};color:#f0f0f0;border-radius:10px;padding:8px 12px;font-size:13px;">⚙️</button>` : "";
  const backBtn = state.view !== "home" ? `<button onclick="nav('home')" style="background:#1e1e1e;border:1px solid #2a2a2a;color:#f0f0f0;border-radius:10px;padding:8px 14px;font-size:13px;">Home</button>` : "";

  return `
    <div class="header" style="padding-left:24px;padding-right:24px;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a;">
      <div>
        <div style="font-size:20px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#FF4500,#DC143C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;">BEAST SCRIPTS</div>
        <div style="font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;">Coach Abdelrahman</div>
      </div>
      <div style="display:flex;gap:8px;">${backBtn}${historyBtn}${settingsBtn}</div>
    </div>
  `;
}

function renderHome() {
  const cards = TEMPLATES.map((t, i) => `
    <button class="card-hover" onclick="selectTemplate(${i})" style="background:linear-gradient(145deg,#141414 0%,${t.color}22 100%);border:1px solid ${t.color}44;border-radius:16px;padding:20px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;animation:slideUp ${0.2 + i*0.05}s ease-out;">
      <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,${t.color}15 0%,transparent 70%);border-radius:50%;"></div>
      <span style="font-size:28px;">${t.icon}</span>
      <span style="font-size:16px;font-weight:800;color:#f0f0f0;line-height:1.3;">${t.title}</span>
      <span style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;">${t.subtitle}</span>
    </button>
  `).join("");

  return `
    <div class="content" style="padding:20px 20px;">
      <div style="text-align:center;padding:32px 0 28px;">
        <div style="font-size:48px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(255,69,0,0.4));">🔥</div>
        <h1 style="font-size:26px;font-weight:900;margin:0 0 8px;line-height:1.3;">Write Scripts That Burn</h1>
        <p style="font-size:14px;color:#888;margin:0;line-height:1.6;">${BRAND.tagline}</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${cards}</div>
    </div>
  `;
}

function renderGenerate() {
  const t = state.selectedTemplate;
  if (!t) return "";

  const customArea = t.id === "custom" ? `
    <div style="margin-bottom:24px;">
      <label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#888;">Describe Your Script</label>
      <textarea id="customInput" oninput="state.customPrompt=this.value" placeholder="Describe your script idea here... e.g., a script about willpower after failure" style="width:100%;min-height:100px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:14px;color:#f0f0f0;font-size:15px;font-family:inherit;resize:vertical;outline:none;line-height:1.7;">${state.customPrompt}</textarea>
    </div>
  ` : "";

  const durationBtns = DURATIONS.map((d, i) => {
    const sel = state.duration.label === d.label;
    return `<button onclick="setDuration(${i})" style="padding:10px 18px;border-radius:10px;border:${sel?'2px solid #FF4500':'1px solid #2a2a2a'};background:${sel?'#FF450020':'#1e1e1e'};color:${sel?'#FF4500':'#f0f0f0'};font-size:14px;font-weight:700;">${d.label}</button>`;
  }).join("");

  const intensityBtns = INTENSITIES.map((x, i) => {
    const sel = state.intensity.desc === x.desc;
    return `<button onclick="setIntensity(${i})" style="padding:10px 16px;border-radius:10px;border:${sel?'2px solid #FF4500':'1px solid #2a2a2a'};background:${sel?'#FF450020':'#1e1e1e'};color:${sel?'#FF4500':'#f0f0f0'};font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">${x.label}</span><span>${x.desc}</span></button>`;
  }).join("");

  const chip = (sel, onclick, label) => `<button onclick="${onclick}" style="padding:9px 14px;border-radius:10px;border:${sel?'2px solid #FF4500':'1px solid #2a2a2a'};background:${sel?'#FF450020':'#1e1e1e'};color:${sel?'#FF4500':'#f0f0f0'};font-size:13px;font-weight:700;">${label}</button>`;
  const hookBtns = HOOKS.map((h, i) => chip(state.hook.id === h.id, `setHook(${i})`, h.label)).join("");
  const formatBtns = FORMATS.map((f, i) => chip(state.format.id === f.id, `setFormat(${i})`, f.label)).join("");
  const toggle = (on, key, label) => `<button onclick="toggleOption('${key}')" style="flex:1;padding:12px;border-radius:10px;border:${on?'2px solid #FF4500':'1px solid #2a2a2a'};background:${on?'#FF450020':'#1e1e1e'};color:${on?'#FF4500':'#888'};font-size:13px;font-weight:700;">${on?'✓ ':''}${label}</button>`;

  const errorBox = state.error ? `<div style="background:#DC143C22;border:1px solid #DC143C44;border-radius:10px;padding:14px;margin-bottom:16px;font-size:14px;color:#ff6b6b;text-align:center;">${state.error}</div>` : "";

  const disabled = state.loading || (t.id === "custom" && !state.customPrompt.trim());
  const btnContent = state.loading
    ? `<span style="display:flex;align-items:center;justify-content:center;gap:10px;"><span style="display:inline-block;width:18px;height:18px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></span>The Beast Is Writing...</span>`
    : `🔥 Generate Script`;

  return `
    <div class="content" style="padding:20px 20px;">
      <div style="display:flex;align-items:center;gap:14px;padding:24px 0 20px;border-bottom:1px solid #2a2a2a;margin-bottom:24px;">
        <div style="font-size:36px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:${t.color}22;border-radius:14px;border:1px solid ${t.color}44;">${t.icon}</div>
        <div>
          <div style="font-size:20px;font-weight:800;">${t.title}</div>
          <div style="font-size:12px;color:#888;">${t.subtitle}</div>
        </div>
      </div>

      ${customArea}

      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:#888;">Video Duration</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${durationBtns}</div>
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:#888;">Intensity Level</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${intensityBtns}</div>
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:#888;">Hook: The First 3 Seconds</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${hookBtns}</div>
        <div style="font-size:12px;color:#666;margin-top:8px;">${state.hook.desc}</div>
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:#888;">Video Format</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${formatBtns}</div>
        <div style="font-size:12px;color:#666;margin-top:8px;">${state.format.desc}</div>
      </div>

      <div style="margin-bottom:32px;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:10px;color:#888;">Extras</label>
        <div style="display:flex;gap:8px;">
          ${toggle(state.withNotes, 'withNotes', '🎥 Shot + On-Screen Text')}
          ${toggle(state.withCaption, 'withCaption', '#️⃣ Caption + Hashtags')}
        </div>
      </div>

      ${errorBox}

      <button onclick="generateScript()" ${disabled?'disabled':''} style="width:100%;padding:16px;border-radius:14px;border:none;background:${state.loading?'#1e1e1e':'linear-gradient(135deg,#FF4500,#DC143C)'};color:#fff;font-size:18px;font-weight:900;letter-spacing:0.5px;opacity:${disabled?'0.4':'1'};">
        ${btnContent}
      </button>
    </div>
  `;
}

function renderResult() {
  const t = state.selectedTemplate;
  const scriptHtml = state.generatedScript.replace(/\n/g, "<br>");
  const words = countWords(state.generatedScript);
  const readTime = estimateReadTime(state.generatedScript);
  const isStreaming = state.streaming;
  const currentHistoryItem = state.history.find(h => h.script === state.generatedScript);
  const currentId = currentHistoryItem ? currentHistoryItem.id : null;
  const isFav = currentId && isFavorite(currentId);

  const errorBox = state.error ? `<div style="background:#DC143C22;border:1px solid #DC143C44;border-radius:10px;padding:14px;margin-bottom:16px;font-size:14px;color:#ff6b6b;text-align:center;">${state.error}</div>` : "";

  return `
    <div class="content" style="padding:20px 20px;">
      <div style="text-align:center;padding:20px 0 16px;">
        <div style="font-size:40px;margin-bottom:8px;">${isStreaming ? '✍️' : (state.error ? '⚠️' : '✅')}</div>
        <h2 style="font-size:22px;font-weight:900;margin:0 0 4px;">${isStreaming ? 'The Beast Is Writing...' : (state.error ? 'Generation Failed' : 'Script Ready')}</h2>
        <p style="font-size:13px;color:#888;margin:0;">${t?t.title:''} &bull; ${state.duration.label} &bull; ${state.intensity.desc}</p>
        <p style="font-size:12px;color:#666;margin:4px 0 0;">${state.hook.label} hook &bull; ${state.format.label}</p>
      </div>

      ${errorBox}

      ${state.generatedScript || isStreaming ? `
        <!-- Stats bar -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;">
          <div id="script-stats" style="font-size:12px;color:#666;">
            ${words > 0 ? `${words} words &bull; ${readTime} read time` : ''}
          </div>
          ${!isStreaming && currentId ? `
            <button class="star-btn" onclick="toggleFavorite(${currentId})" style="background:none;border:none;font-size:22px;padding:4px 8px;color:${isFav ? '#FFD700' : '#555'};">
              ${isFav ? '★' : '☆'}
            </button>
          ` : ''}
        </div>

        <!-- Script display -->
        ${isStreaming ? `
          <div id="script-output" class="streaming-cursor" style="background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin-bottom:16px;line-height:2;font-size:16px;direction:rtl;min-height:120px;max-height:60vh;overflow-y:auto;">
            ${scriptHtml}
          </div>
        ` : `
          <textarea id="script-edit" class="script-editable" rows="12">${state.generatedScript}</textarea>
          <div style="font-size:11px;color:#444;margin:-10px 0 16px 0;padding:0 4px;">Tap the text above to edit before copying</div>
        `}
      ` : ''}

      ${!isStreaming ? `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">
          ${state.generatedScript ? `
            <button onclick="copyScript()" style="padding:12px 8px;border-radius:12px;border:1px solid #FF4500;background:transparent;color:#FF4500;font-size:13px;font-weight:700;">Copy</button>
            <button onclick="shareWhatsApp()" style="padding:12px 8px;border-radius:12px;border:1px solid #25D366;background:transparent;color:#25D366;font-size:13px;font-weight:700;">WhatsApp</button>
          ` : `
            <div></div><div></div>
          `}
          <button onclick="regenerate()" style="padding:12px 8px;border-radius:12px;border:none;background:linear-gradient(135deg,#FF4500,#DC143C);color:#fff;font-size:13px;font-weight:700;">${state.error ? 'Try Again' : 'New Script'}</button>
        </div>
        <button onclick="nav('home')" style="width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:14px;font-weight:600;">Back to Home</button>
      ` : `
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;color:#888;font-size:14px;">
          <span style="display:inline-block;width:14px;height:14px;border:2px solid #FF450044;border-top-color:#FF4500;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
          Generating...
        </div>
      `}
    </div>
  `;
}

function renderHistory() {
  const showFavs = state.historyFilter === "favorites";
  const filteredHistory = showFavs ? state.history.filter(h => isFavorite(h.id)) : state.history;

  const filterBtns = `
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button onclick="state.historyFilter='all';render()" style="padding:8px 16px;border-radius:8px;border:1px solid ${!showFavs?'#FF4500':'#2a2a2a'};background:${!showFavs?'#FF450020':'transparent'};color:${!showFavs?'#FF4500':'#888'};font-size:13px;font-weight:700;">All (${state.history.length})</button>
      <button onclick="state.historyFilter='favorites';render()" style="padding:8px 16px;border-radius:8px;border:1px solid ${showFavs?'#FFD700':'#2a2a2a'};background:${showFavs?'#FFD70020':'transparent'};color:${showFavs?'#FFD700':'#888'};font-size:13px;font-weight:700;">Favorites (${state.history.filter(h => isFavorite(h.id)).length})</button>
      ${state.history.length > 0 ? `<button onclick="clearAllHistory()" style="margin-left:auto;padding:8px 16px;border-radius:8px;border:1px solid #DC143C44;background:transparent;color:#DC143C;font-size:13px;font-weight:700;">Clear All</button>` : ''}
    </div>
  `;

  if (filteredHistory.length === 0) {
    const emptyMsg = showFavs ? "No favorites yet" : "No scripts yet";
    const emptyDesc = showFavs ? "Tap the star on any script to add it to favorites" : "Start by generating your first script!";
    return `
      <div class="content" style="padding:20px 20px;">
        <h2 style="font-size:22px;font-weight:900;padding:20px 0 16px;">Script History</h2>
        ${filterBtns}
        <div style="text-align:center;padding:60px 20px;color:#888;">
          <div style="font-size:48px;margin-bottom:16px;opacity:0.4;">${showFavs ? '★' : '📝'}</div>
          <p style="font-size:15px;">${emptyMsg}</p>
          <p style="font-size:13px;">${emptyDesc}</p>
        </div>
      </div>
    `;
  }

  const items = filteredHistory.map((item, i) => {
    const date = new Date(item.timestamp).toLocaleDateString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
    const preview = item.script.substring(0, 120) + (item.script.length > 120 ? "..." : "");
    const words = countWords(item.script);
    const readTime = estimateReadTime(item.script);
    const fav = isFavorite(item.id);
    return `
      <div onclick="viewHistoryItem(${i}, ${showFavs})" style="background:#141414;border:1px solid ${fav?'#FFD70033':'#2a2a2a'};border-radius:14px;padding:16px;cursor:pointer;animation:slideUp ${0.15+i*0.05}s ease-out;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:22px;">${item.icon}</span>
            <div>
              <div style="font-size:15px;font-weight:700;">${item.template}</div>
              <div style="font-size:11px;color:#888;">${item.duration} &bull; ${item.intensity}${item.format ? ` &bull; ${item.format}` : ''} &bull; ${words} words &bull; ${readTime}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:4px;">
            <button class="star-btn" onclick="event.stopPropagation();toggleFavorite(${item.id})" style="background:none;border:none;color:${fav?'#FFD700':'#444'};font-size:18px;padding:4px;">
              ${fav ? '★' : '☆'}
            </button>
            <button onclick="event.stopPropagation();deleteHistory(${item.id})" style="background:none;border:none;color:#555;font-size:18px;padding:4px;">✕</button>
          </div>
        </div>
        <div style="font-size:13px;color:#888;line-height:1.8;direction:rtl;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;">${preview}</div>
        <div style="font-size:11px;color:#444;margin-top:10px;text-align:right;">${date}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="content" style="padding:20px 20px;">
      <h2 style="font-size:22px;font-weight:900;padding:20px 0 16px;">Script History</h2>
      ${filterBtns}
      <div style="display:flex;flex-direction:column;gap:12px;">${items}</div>
    </div>
  `;
}

function renderSettings() {
  const s = state.settings;
  if (!s) return "";
  const d = state.settingsDraft;
  const card = (id, icon, title, desc) => {
    const sel = s.provider === id;
    return `<button onclick="setProvider('${id}')" style="flex:1;text-align:left;padding:16px;border-radius:14px;border:${sel?'2px solid #FF4500':'1px solid #2a2a2a'};background:${sel?'#FF450015':'#141414'};color:#f0f0f0;display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:24px;">${icon}</span>
      <span style="font-size:15px;font-weight:800;">${title}</span>
      <span style="font-size:12px;color:#888;line-height:1.5;">${desc}</span>
    </button>`;
  };
  const input = (id, value, placeholder, type) => `<input id="${id}" type="${type||'text'}" value="${esc(value)}" placeholder="${esc(placeholder)}" oninput="state.settingsDraft.${id}=this.value" style="width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:14px;color:#f0f0f0;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;" />`;
  const step = (n, html) => `<div style="display:flex;gap:10px;margin-bottom:10px;font-size:13px;color:#bbb;line-height:1.6;"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#FF450030;color:#FF4500;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px;">${n}</span><span>${html}</span></div>`;
  const code = (t) => `<code style="background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;padding:2px 6px;font-size:12px;color:#f0f0f0;">${esc(t)}</code>`;

  const groqPanel = `
    ${step(1, `Create a free account at <a href="https://console.groq.com/keys" target="_blank" style="color:#FF4500;">console.groq.com/keys</a>`)}
    ${step(2, `Click <b>Create API Key</b>, copy it, and paste it below`)}
    ${input("groqKey", d.groqKey, s.hasGroqKey ? "Key saved ✓ (paste a new one to replace it)" : "gsk_...", "password")}
    <div style="font-size:12px;color:#666;margin-bottom:4px;">Free, no card needed. Uses the internet. Best Arabic quality. The key stays on this PC, encrypted.</div>
  `;
  const ollamaPanel = `
    ${step(1, `Install Ollama (free) from <a href="https://ollama.com/download" target="_blank" style="color:#FF4500;">ollama.com/download</a>`)}
    ${step(2, `Open Command Prompt and run ${code("ollama pull " + (d.ollamaModel || s.ollamaModel))} (one-time download, about 5 GB)`)}
    ${step(3, `Keep Ollama running. After that, no internet is needed.`)}
    <label style="display:block;font-size:12px;font-weight:700;margin:6px 0 8px;color:#888;">Model</label>
    ${input("ollamaModel", d.ollamaModel || s.ollamaModel, "qwen2.5:7b")}
    <div style="font-size:12px;color:#666;margin-bottom:4px;">Works fully offline. Needs a decent PC (16 GB RAM recommended). Arabic is weaker than Groq and it's slower without a graphics card.</div>
  `;

  return `
    <div class="content" style="padding:20px 20px;">
      <h2 style="font-size:22px;font-weight:900;padding:20px 0 6px;">Settings</h2>
      <p style="font-size:13px;color:#888;margin-bottom:20px;">Choose which AI writes your scripts. Both are free.</p>
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        ${card("groq", "☁️", "Groq", "Free online AI. Needs internet.")}
        ${card("ollama", "💻", "Local AI", "Runs on this PC. Fully offline.")}
      </div>
      <div style="background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:18px;margin-bottom:20px;">
        ${s.provider === "ollama" ? ollamaPanel : groqPanel}
      </div>
      <button onclick="saveSettings()" style="width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#FF4500,#DC143C);color:#fff;font-size:16px;font-weight:900;">Save</button>
    </div>
  `;
}

// ─── ACTIONS ───
function nav(view) { state.view = view; render(); window.scrollTo(0,0); haptic(); }
function selectTemplate(i) { state.selectedTemplate = TEMPLATES[i]; state.view = "generate"; state.error = ""; render(); window.scrollTo(0,0); haptic(); }
function setDuration(i) { state.duration = DURATIONS[i]; render(); haptic(); }
function setIntensity(i) { state.intensity = INTENSITIES[i]; render(); haptic(); }
function setHook(i) { state.hook = HOOKS[i]; render(); haptic(); }
function setFormat(i) { state.format = FORMATS[i]; render(); haptic(); }
function toggleOption(key) { state[key] = !state[key]; render(); haptic(); }
function regenerate() { state.generatedScript = ""; state.error = ""; state.view = "generate"; render(); }

async function setProvider(provider) {
  state.settings = await window.beastDesktop.saveSettings({ provider });
  render();
  haptic();
}

async function saveSettings() {
  const d = state.settingsDraft;
  state.settings = await window.beastDesktop.saveSettings({ groqKey: d.groqKey, ollamaModel: d.ollamaModel });
  state.settingsDraft = { groqKey: "", ollamaModel: "" };
  showToast("Saved");
  haptic();
}

function viewHistoryItem(i, fromFavorites) {
  const list = fromFavorites ? state.history.filter(h => isFavorite(h.id)) : state.history;
  const item = list[i];
  state.generatedScript = item.script;
  state.selectedTemplate = TEMPLATES.find(t => t.title === item.template) || TEMPLATES[0];
  state.view = "result";
  render();
  window.scrollTo(0,0);
  haptic();
}

function deleteHistory(id) {
  state.history = state.history.filter(h => h.id !== id);
  state.favorites = state.favorites.filter(f => f !== id);
  saveHistory();
  render();
  haptic();
}

function clearAllHistory() {
  if (state.history.length === 0) return;
  state.history = [];
  state.favorites = [];
  saveHistory();
  showToast("History cleared");
  haptic();
}

function bindEvents() {
  const ta = document.getElementById("customInput");
  if (ta) ta.value = state.customPrompt;

  const editArea = document.getElementById("script-edit");
  if (editArea) {
    editArea.addEventListener("input", () => {
      state.generatedScript = editArea.value;
      if (state.history.length > 0) {
        state.history[0].script = editArea.value;
        saveHistory();
      }
    });
  }
}

// ─── SERVICE WORKER ───
if (!IS_DESKTOP && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(() => {
    console.log('SW registered');
  }).catch(e => console.log('SW failed', e));
}

// ─── INIT ───
loadHistory();
render();

// Desktop: load AI settings, and open Settings first if nothing is set up yet
if (IS_DESKTOP) {
  window.beastDesktop.getSettings().then((s) => {
    state.settings = s;
    if (s.provider === "groq" && !s.hasGroqKey) state.view = "settings";
    render();
  });
}
</script>

</body>
</html>
