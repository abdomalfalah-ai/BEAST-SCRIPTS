<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Beast Scripts</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a0a; color:#f0f0f0; font-family:'Segoe UI',sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
    h1 { font-size:22px; font-weight:900; margin:12px 0 8px; }
    p { color:#888; font-size:14px; line-height:1.6; margin:0 0 6px; }
    .small { font-size:12px; color:#555; word-break:break-all; }
    a { display:inline-block; margin-top:20px; padding:14px 36px; border-radius:14px; background:linear-gradient(135deg,#FF4500,#DC143C); color:#fff; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:48px;">🔌</div>
    <h1>Can't reach Beast Scripts</h1>
    <p>Check your internet connection. If you're online, the server may be waking up (this can take up to a minute) or it may be down.</p>
    <p class="small" id="reason"></p>
    <a href="beast-retry://reload">Retry</a>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("reason").textContent = (q.get("reason") || "") + " " + (q.get("url") || "");
  </script>
</body>
</html>
